---
# tasks file for backup
- name: Create folder for archive
  ansible.builtin.file:
    state: directory
    dest: "{{ log_backup_dir }}"
    owner: root
    group: root
    mode: "0750"

- name: Add the script
  ansible.builtin.template:
    src: log_backup.sh.j2
    dest: /usr/local/sbin/log_backup.sh
    owner: root
    group: root
    mode: "0750"

- name: Add the service
  ansible.builtin.template:
    src: log-backup.service.j2
    dest: /etc/systemd/system/log-backup.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart log-backup timer

- name: Add a timer
  ansible.builtin.template:
    src: log-backup.timer.j2
    dest: /etc/systemd/system/log-backup.timer
    owner: root
    group: root
    mode: "0644"
  notify: Restart log-backup timer

- name: Turn on the script timer
  ansible.builtin.systemd:
    name: log-backup.timer
    daemon_reload: true
    enabled: true
    state: started

