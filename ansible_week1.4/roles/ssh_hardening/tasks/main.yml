---
# tasks file for ssh_hardening
- name: Add public key for {{ ssh_authorized_keys_user }}
  ansible.posix.authorized_key:
    user: "{{ ssh_authorized_keys_user }}"
    key: "{{ lookup('file', ssh_public_key_path) }}"
    state: present

- name: Deploy sshd hardering config
  ansible.builtin.template:
    src: 00-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd
