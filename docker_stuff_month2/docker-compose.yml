services:
  proxy:
    build:
      context: "./proxy"
      dockerfile: Dockerfile
    depends_on:
      backend1:
           condition: service_healthy
      backend2:
           condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    networks:
      - frontend
      - backend
    ports:
      - "127.0.0.1:8080:8080"
    restart: "unless-stopped"
    stop_grace_period: "10s"

  backend1:
    build:
      context: "."
      dockerfile: backend/Dockerfile
    image: backend:dev
    hostname: backend1
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    networks:
      - backend
    restart: "unless-stopped"
    stop_grace_period: "10s"


  backend2:
    build:
      context: "."
      dockerfile: backend/Dockerfile
    image: backend:dev
    hostname: backend2
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    networks:
      - backend
    restart: "unless-stopped"
    stop_grace_period: "10s"

  nginx-exporter-backend1:
    image: nginx/nginx-prometheus-exporter:1.5.3
    command: --nginx.scrape-uri=http://backend1:8081/stub_status
    restart: unless-stopped
    networks:
      - backend
      - monitoring
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 32M

  nginx-exporter-backend2:
    image: nginx/nginx-prometheus-exporter:1.5.3
    command: --nginx.scrape-uri=http://backend2:8081/stub_status
    restart: unless-stopped
    networks:
      - backend
      - monitoring
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 32M

  nginx-exporter-proxy:
    image: nginx/nginx-prometheus-exporter:1.5.3
    command: --nginx.scrape-uri=http://proxy:8081/stub_status
    restart: unless-stopped
    networks:
      - backend
      - monitoring
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 32M


networks:
  frontend:
    driver: bridge
  backend:
    internal: true
    driver: bridge
  monitoring:
    external: true
