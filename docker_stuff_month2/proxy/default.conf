log_format upstream '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'upstream=$upstream_addr ustatus=$upstream_status '
                    'rt=$request_time urt=$upstream_response_time';

resolver 127.0.0.11 valid=10s ipv6=off;

upstream backends {
    zone backends 64k;
    server backend1:8080 resolve max_fails=3 fail_timeout=30s;
    server backend2:8080 resolve max_fails=3 fail_timeout=30s;
    keepalive 16;
}

server {
    listen 8080;
    server_tokens off;
    absolute_redirect off;

    access_log /dev/stdout upstream;
    error_log /dev/stderr warn;

    add_header X-Upstream $upstream_addr always;

    location / {
        proxy_pass http://backends;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}

server {
  listen 8081;

    location = /stub_status {
        stub_status; 
        access_log off;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        deny all;
}
}
