name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "aws_project/api/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  ECR_REPOSITORY: bankapi
  ECS_CLUSTER: bankapi
  ECS_SERVICE: bankapi
  CONTAINER_NAME: bankapi
  IMAGE_TAG: ${{ github.sha }}
  HEALTH_URL: https://devopspavel.me/api/health

jobs:
  deploy:
    name: Deploy backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image name
        id: image
        run: |
          echo "uri=${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Check if image already exists
        id: exists
        run: |
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
               --image-ids imageTag="$IMAGE_TAG" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image
        if: steps.exists.outputs.found == 'false'
        run: |
          docker build --pull --platform linux/amd64 --provenance=false \
            -t "${{ steps.image.outputs.uri }}" aws_project/api
          docker push "${{ steps.image.outputs.uri }}"

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition --task-definition "$ECS_SERVICE" \
            --query taskDefinition > task-definition.json

      - name: Put new image into task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.image.outputs.uri }}

      - name: Register task definition
        id: register
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}

      - name: Run database migration
        env:
          TASK_DEF_ARN: ${{ steps.register.outputs.task-definition-arn }}
        run: |
          NETWORK=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].networkConfiguration' --output json)

          OVERRIDES=$(printf '{"containerOverrides":[{"name":"%s","command":["python","migrate.py"]}]}' \
            "$CONTAINER_NAME")

          TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --launch-type EC2 \
            --task-definition "$TASK_DEF_ARN" \
            --network-configuration "$NETWORK" \
            --overrides "$OVERRIDES" \
            --query 'tasks[0].taskArn' --output text)

          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "None" ]; then
            echo "::error::Migration task was not started"
            exit 1
          fi

          echo "Migration task: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)

          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::Migration failed with exit code $EXIT_CODE"
            aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
              --query 'tasks[0].stoppedReason' --output text
            exit 1
          fi

      - name: Switch service to new task definition
        env:
          TASK_DEF_ARN: ${{ steps.register.outputs.task-definition-arn }}
        run: |
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --task-definition "$TASK_DEF_ARN" > /dev/null
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"

      - name: Smoke test
        run: curl -fsS --retry 5 --retry-delay 10 --retry-all-errors "$HEALTH_URL"
